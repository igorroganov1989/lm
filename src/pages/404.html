<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>404</title>
    <link rel="stylesheet" href="/styles/style.scss" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    {{> sections/Header }} {{> sections/Menu }} {{> MegaMenu }} {{> MegaMenuMobile }}

    <main class="main">
      <div class="main__wrapper">
        {{> BreadCrumbs breadcrumbs=breadcrumbsError}}
        <div class="main__container container">
          <h1 class="main__title">Страница не найдена</h1>
          <div class="main__subtitle">Похоже, такой страницы больше нет или она была перемещена</div>
        </div>
      </div>
      {{> sections/Error }}
    </main>

    {{> sections/Footer }} {{> PopupCalculation}} {{> PopupRequest}}

    <script type="module" src="../scripts/main.js"></script>
  </body>
</html>
